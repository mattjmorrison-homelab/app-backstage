app:
  # Reachable through the cluster ingress -- same value as backend.baseUrl,
  # since the new backend system serves the frontend from the same process.
  baseUrl: https://backstage.morrisons.site

backend:
  # Must be the externally-reachable URL (browser + GitHub's OAuth callback
  # both hit this), not the in-cluster address.
  baseUrl: https://backstage.morrisons.site
  # The listener can also be expressed as a single <host>:<port> string. In this case we bind to
  # all interfaces, the most permissive setting. The right value depends on your specific deployment.
  listen: ':7007'

  # Service-to-service auth between backend plugins -- see
  # https://backstage.io/docs/auth/service-to-service-auth. Sourced from
  # OpenBao (kv/homelab/k8s-backstage/backend-auth-key) via ExternalSecret.
  auth:
    keys:
      - secret: ${BACKEND_SECRET}

  # config options: https://node-postgres.com/apis/client
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      # https://node-postgres.com/features/ssl
      # you can set the sslmode configuration option via the `PGSSLMODE` environment variable
      # see https://www.postgresql.org/docs/current/libpq-ssl.html Table 33.1. SSL Mode Descriptions (e.g. require)
      # ssl:
      #   ca: # if you have a CA file and want to verify it you can uncomment this section
      #     $file: <file-path>/ca/server.crt

integrations:
  github:
    - host: github.com
      apps:
        # Authenticates the catalog/scaffolder GitHub integration as the
        # dedicated homelab-backstage GitHub App instead of a personal
        # access token -- same App used for sign-in below. No
        # webhookSecret: this App's webhook is disabled for now (bare-app
        # pass, no catalog discovery/event processing yet).
        - appId: ${GITHUB_APP_ID}
          clientId: ${AUTH_GITHUB_CLIENT_ID}
          clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
          privateKey: ${GITHUB_APP_PRIVATE_KEY}

auth:
  providers:
    guest: {}
    github:
      production:
        clientId: ${AUTH_GITHUB_CLIENT_ID}
        clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
        signIn:
          resolvers:
            # No catalog wiring yet (bare-app pass, todo #41) -- this
            # resolver explicitly allows sign-in without a matching User
            # entity in the catalog. Revisit once catalog discovery lands
            # and real User/Group entities exist to resolve against.
            - resolver: usernameMatchingUserEntityName
              dangerouslyAllowSignInWithoutUserInCatalog: true

catalog:
  # Overrides the default list locations from app-config.yaml as these contain example data.
  # See https://backstage.io/docs/features/software-catalog/#adding-components-to-the-catalog for more details
  # on how to get entities into the catalog.
  locations:
    # Local example data, replace this with your production config, these are intended for demo use only.
    # File locations are relative to the backend process, typically in a deployed context, such as in a Docker container, this will be the root
    - type: file
      target: ./examples/entities.yaml

    # Local example template
    - type: file
      target: ./examples/template/template.yaml
      rules:
        - allow: [Template]

    # Local example organizational data
    - type: file
      target: ./examples/org.yaml
      rules:
        - allow: [User, Group]
