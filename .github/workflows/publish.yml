name: Publish

on:
  pull_request:
    types: [closed]

jobs:
  promote:
    if: github.event.pull_request.merged == true
    runs-on: k8s-amd64
    steps:
      - name: Promote the PR's already-built image to the deployed tag
        uses: mattjmorrison-homelab/actions-k8s@955b466878ae777505b822bb6c241f4f4e6805b5 # main
        with:
          service-account: app-backstage-job
          image: gcr.io/go-containerregistry/crane@sha256:1f968817b95790bed063f71175aa6b8ff879fa17064020415f3e18bb6e6a36e1
          shell: "false"
          command: >-
            tag registry.morrisons.site/app-backstage:pr-${{ github.event.pull_request.head.sha }}
            registry.morrisons.site/app-backstage:${{ github.event.pull_request.head.sha }}
          secret-volume: app-backstage-zot-pull-secret:/kaniko/.docker
          active-deadline-seconds: "120"

      - name: Notify Discord on failure
        if: failure()
        uses: mattjmorrison-homelab/actions-openbao@a9a15ee54f4b6a08b17ddd55df99d5109cfb5748 # main
        with:
          role: app-backstage-discord
          kv-path: homelab/service/admin-discord/app-backstage/webhook-url
          output-name: DISCORD_WEBHOOK_URL
      - if: failure()
        run: >-
          curl -sf -H "Content-Type: application/json" -X POST
          -d "{\"content\": \"🔴 **app-backstage** promote failed — ${{ github.event.pull_request.head.sha }}\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
          "$DISCORD_WEBHOOK_URL"
